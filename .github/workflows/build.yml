name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - name: Build and check Android
        run: ./editor-android/build.ps1 -Test
      - name: Prepare WiX 3.14.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'wix.zip'
          $wix = Join-Path $env:RUNNER_TEMP 'wix'
          Invoke-WebRequest 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31') { throw 'WiX checksum mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath $wix
          $wix | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build and check Windows installer
        shell: pwsh
        run: |
          $version = '1.2.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME.TrimStart('v') }
          ./editor-windows/package.ps1 -Version $version
      - name: Collect packages and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item editor-android/build/txteditor-android.apk dist/TXTDesign-android.apk
          Copy-Item editor-windows/build/installer/*.exe dist/
          Copy-Item editor-windows/build/txteditor-windows.jar dist/
          Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: TXTDesign-packages
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TXTDesign-packages
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          离线 UTF-8 文本编辑器，源码与构建说明见仓库 README。

          - Android 8.0+：TXTDesign-android.apk（R8 精简，演示用调试签名）。
          - Windows x64：TXTDesign-*.exe（内含 Temurin Java 21 运行时，无需另装 Java）。
          - 已有 Java 8+：txteditor-windows.jar。
          - SHA256SUMS.txt：安装包校验值；源码下载见下方 Source code。

          安卓自动构建使用临时调试证书，不保证与上一版本同签名；覆盖安装前请先保存文档。
          Windows 安装器未使用商业代码签名证书。
          EOF
          gh release create "$TAG" dist/* --repo "$GH_REPO" --verify-tag --title "TXTDesign $TAG" --notes-file release-notes.md
